# Local / default Worker config (static assets via Workers, not Pages).
# Never set pages_build_output_dir here — it forces Pages mode.
# Cloudflare Workers Builds Deploy command should use:
#   npx wrangler deploy --config ./ci/wrangler.toml --autoconfig=false
name = "subliminax"
main = "src/index.js"
compatibility_date = "2026-11-23"

[observability]
enabled = true

[[routes]]
pattern = "subliminax.com"
custom_domain = true

[[routes]]
pattern = "www.subliminax.com"
custom_domain = true

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
